name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck jq
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - run: make lint
      - run: make test

  # Windows runs the same suite under Git Bash. The point is the real-machine
  # signal tests: they exercise the powershell.exe backends, which nothing on
  # macOS or Linux can. No `make lint` — shellcheck already ran twice above.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g bats
      - run: bats tests/
